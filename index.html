    --ground: oklch(97.5% 0.004 240);
    --ink: oklch(20% 0.01 250);

    --dot: oklch(20% 0.01 250 / 0.82);
    --accent: oklch(56% 0.2 28);
    --m: clamp(16px, 5vw, 80px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: oklch(17% 0.01 250);
      --ink: oklch(94% 0.005 240);
      --muted: oklch(72% 0.01 250);

    }

    --muted: oklch(72% 0.01 250);
    --dot: oklch(94% 0.005 240 / 0.78);
    --accent: oklch(70% 0.17 28);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 400 18px/1.5 "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    font-kerning: normal;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  .wrap { padding-inline: var(--m); }
  header { padding-top: 32px; }
  .name { font-weight: 600; font-size: 18px; letter-spacing: 0.01em; }
  main { flex: 1; display: flex; align-items: center; padding-block: 48px 40px; }
  h1 {
    font-weight: 600;
    font-size: clamp(40px, 7vw, 101px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    max-width: 12.5em;
    text-rendering: optimizeLegibility;
    text-wrap: balance;
  }
  h1 .role { display: block; color: var(--muted); }
  .field { color: var(--ink); }
  .field svg { display: block; width: 100%; height: auto; }
  .field circle { fill: var(--dot); }
  .field circle.a { fill: var(--accent); }
  .field .narrow { display: none; }
  footer {
    padding-block: 32px 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 40px;
    font-size: 18px;
  }
  footer a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    display: inline-block;
    padding-block: 10px;
  }
  footer a.mail { color: var(--accent); font-weight: 600; }
  footer a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  @media (max-width: 640px) {
    main { padding-block: 48px 40px; align-items: flex-end; }
    .field .wide { display: none; }
    .field .narrow { display: block; }
    footer { flex-direction: column; gap: 0; padding-block: 24px 32px; }
  }
</style>
